name: 버스 승차 인원 자동 수집

on:
  schedule:
    # 매 5분마다 실행 (한국시간 07:00-23:00)
    - cron: '*/5 22-23,0-14 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 데이터 수집 실행
        env:
          BUS_API_KEY: ${{ secrets.BUS_API_KEY }}
        run: node collect_bus_data.js
      
      - name: 변경된 데이터 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add data/
          git diff --staged --quiet || git commit -m "데이터 수집: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
