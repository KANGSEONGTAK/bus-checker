name: 버스 승차 인원 자동 수집

on:
  schedule:
    # 한국시간 6:15 = UTC 일~목 21:15 (정각 회피로 cron 지연 줄이기)
    # 스크립트가 KST 6:30까지 대기 후 8:30까지 수집 — GitHub cron 지연 흡수
    - cron: '15 21 * * 0-4'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 데이터 수집 실행 + 10분마다 중간 커밋 (7:35 알림이 당일 데이터 활용 가능)
        env:
          BUS_API_KEY: ${{ secrets.BUS_API_KEY }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          node collect_bus_data.js &
          COLLECT_PID=$!
          while kill -0 $COLLECT_PID 2>/dev/null; do
            sleep 600
            git add data/
            git diff --staged --quiet || (git commit -m "데이터 수집 중: $(date -u '+%H:%M') UTC" && git push)
          done
          git add data/
          git diff --staged --quiet || (git commit -m "데이터 수집 완료" && git push)
